plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rgapro1.ocaso'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rgapro1.ocaso'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '1.7'
    }

    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/libmlkit_google_ocr_pipeline.so']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

// El flujo histórico de MainActivityV2 se normaliza en CI mediante Scripts/.
// Este paso sustituye el método OCR final por el motor multipasada nuevo,
// independientemente de qué parche previo haya dejado el método en el árbol.
def patchDniOcr = tasks.register('patchDniOcr') {
    doLast {
        File target = file('src/main/java/com/rgapro1/ocaso/MainActivityV2.java')
        String source = target.getText('UTF-8')
        if (source.contains('DniOcrEngine.process(frontBitmap,backBitmap')) return

        String signature = '    private void processDniPairOcr(){'
        int start = source.indexOf(signature)
        if (start < 0) throw new GradleException('No se encontró processDniPairOcr; se evita compilar con un OCR incierto.')
        int brace = source.indexOf('{', start)
        int depth = 0
        int end = -1
        for (int i = brace; i < source.length(); i++) {
            char ch = source.charAt(i)
            if (ch == '{') depth++
            else if (ch == '}') {
                depth--
                if (depth == 0) { end = i + 1; break }
            }
        }
        if (end < 0) throw new GradleException('processDniPairOcr tiene llaves desbalanceadas.')

        String newMethod = '''    private void processDniPairOcr(){
        if(frontBitmap==null||backBitmap==null)return;
        DniOcrEngine.process(frontBitmap,backBitmap,new DniOcrEngine.Callback(){
            @Override public void onSuccess(String front,String back,Bitmap preparedFront,Bitmap preparedBack){
                frontText=front==null?"":front;
                backText=back==null?"":back;
                frontBitmap=preparedFront;
                backBitmap=preparedBack;
                currentBitmap=preparedFront;
                previewBitmap=preparedFront;
                currentImagePath=frontImagePath;
                showIdentityReview(parseEssentialRobust(frontText+"\\n"+backText));
            }
            @Override public void onFailure(Exception e){
                Toast.makeText(MainActivityV2.this,"OCR: "+(e==null?"error":e.getMessage()),Toast.LENGTH_LONG).show();
            }
        });
    }'''
        target.write(source.substring(0, start) + newMethod + source.substring(end), 'UTF-8')
    }
}

preBuild.dependsOn(patchDniOcr)
