name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize OCR patch script
        run: python3 Scripts/fix_ocr_patch_script_escape.py

      - name: Apply reliable front DNI OCR patch
        run: python3 Scripts/patch_ocr_front_reliable.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: RgaPro1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
