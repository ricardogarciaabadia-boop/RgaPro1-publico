name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --stacktrace > build.log 2>&1
          status=$?
          cat build.log
          exit $status

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: RgaPro1-build-diagnostics
          path: build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: RgaPro1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
