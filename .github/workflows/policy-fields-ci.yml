name: Policy fields CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Apply policy field label fix
        run: python3 Scripts/patch_policy_field_labels.py
      - name: Normalize Java source
        run: python3 Scripts/normalize_build_sources.py
      - name: Commit normalized source
        shell: bash
        run: |
          if git diff --quiet; then echo "No source normalization changes needed"; else git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add app/src/main/java/com/rgapro1/ocaso/OcasoPolicyParser.java app/src/main/java/com/rgapro1/ocaso/MainActivityV2.java app/src/main/java/com/rgapro1/ocaso/Client360Activity.java; git commit -m "fix: policy fields use values not labels"; git push; fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: RgaPro1-policy-fields-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
