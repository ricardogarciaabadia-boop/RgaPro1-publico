name: Extract project folders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -o Comprimido.zip -d /tmp/project

          # The ZIP contains the scripts directory in lowercase.
          # Normalize it to the requested Scripts/ directory.
          if [ -d /tmp/project/scripts ]; then
            mkdir -p Scripts
            cp -a /tmp/project/scripts/. Scripts/
          fi

          # Copy the Android app while preserving the existing app/ structure.
          if [ -d /tmp/project/app ]; then
            mkdir -p app
            cp -a /tmp/project/app/. app/
          fi

          git status --short

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app Scripts
          git reset -- Comprimido.zip .github/workflows/extract-project.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Extract app and Scripts folders"
            git push
          fi
