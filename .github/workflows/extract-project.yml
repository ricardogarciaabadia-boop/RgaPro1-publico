name: Extract project folders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -o Comprimido.zip -d /tmp/project

          # Copy the ZIP contents into the repository, preserving folders.
          # The ZIP is kept temporarily so the extraction can be checked.
          cp -a /tmp/project/. .

          git status --short

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app Scripts . 2>/dev/null || true
          git reset -- Comprimido.zip .github/workflows/extract-project.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Extract public project folders"
            git push
          fi
